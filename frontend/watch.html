<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch — Navvora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
  <a class="logo" href="index.html">NAVVORA</a>
  <a href="index.html">← Back</a>
</header>

<main class="watch-page">
  <div class="player-wrapper" id="playerWrapper">
    <div class="player-message">
      <div class="player-icon">▶</div>
      <h2 id="playerTitle">Preparing player...</h2>
      <p id="playerMessage">
        The large-file streaming adapter is not enabled in this starter build.
      </p>
    </div>
  </div>

  <section class="video-details">
    <h1 id="videoTitle">Loading...</h1>
    <div id="videoMeta"></div>
    <p id="videoDescription"></p>
  </section>
</main>

<script src="js/config.js"></script>
<script src="js/player.js"></script>
</body>
</html>
